[project]
name = "glaciation-time-estimator"          # distribution name on PyPI
version = "1.3.0"
authors = [{name = "Dragomir Nikolov", email = "dnikolo@ethz.ch"}]
description = "Detect cloud-glaciation events and calculate their properties"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "numba", "xarray", "pandas", "numba"]

[project.optional-dependencies]
test = ["pytest", "pyproj", "pyresample", "PyYAML", "h5netcdf"]

[project.urls]
Homepage = "https://github.com/DragomirNikolov/Glaciation_time_estimator"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["glaciation_time_estimator"]
